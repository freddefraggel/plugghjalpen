name: Publicera backend (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/lib/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      CLASS_CODES: ${{ secrets.CLASS_CODES }}
    steps:
      - name: Kontrollera inställningar
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN eller CLOUDFLARE_ACCOUNT_ID saknas, hoppar över publicering av backend."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - run: npm test
        if: steps.check.outputs.skip != 'true'
      - name: Publicera Worker
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler deploy --config worker/wrangler.toml
      - name: Lägg in hemligheter
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ -n "$AI_API_KEY" ]; then printf '%s' "$AI_API_KEY" | npx wrangler secret put AI_API_KEY --config worker/wrangler.toml; fi
          if [ -n "$CLASS_CODES" ]; then printf '%s' "$CLASS_CODES" | npx wrangler secret put CLASS_CODES --config worker/wrangler.toml; fi
