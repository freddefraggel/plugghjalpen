name: Deploy till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Varje måndag hämtas kursplanerna från Skolverket på nytt och sajten byggs om.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Hämta Lgr22 från Skolverket
        # Om Skolverkets API inte svarar byggs appen ändå; då används AI:ns egen kunskap om läroplanen.
        run: npm run lgr22 || echo "::warning::Kunde inte hämta kursplaner från Skolverket"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
